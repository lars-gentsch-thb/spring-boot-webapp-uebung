name: SonarQube Cloud

# Analyse mit dem Maven-Scanner (die frühere sonarcloud-github-action ist deprecated)
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # volle Historie für bessere Analyse (Blame, neuer Code)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Cache für SonarQube-Cloud-Pakete
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Bauen, testen und analysieren
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Secret SONAR_TOKEN fehlt, Analyse wird übersprungen."
            exit 0
          fi
          # sonar.organization und sonar.projectKey stehen in der pom.xml
          ./mvnw -B verify sonar:sonar
